
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLife</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #3347a8;
    }

    p {
      color: #444;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-width: 60%;
    }

    button {
      background: #3347a8;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 10px auto;
      padding: 12px;
      border-radius: 8px;
      max-width: 400px;
      overflow-wrap: anywhere;
    }

    .done-button {
      background: #218838;
    }

    .done-button:disabled {
      background: #6c757d;
      cursor: default;
    }

    .tick {
      color: #218838;
      font-weight: bold;
      font-size: 20px;
      margin-right: 5px;
    }
  </style>
</head>

<body>
  <h1>DailyLife</h1>
  <p>আমার দৈনন্দিন রুটিন</p>

  <input
    id="routineInput"
    type="text"
    placeholder="রুটিন লিখো..."
  >

  <button id="addButton" type="button">
    রুটিন যোগ করো
  </button>

  <ul id="routineList"></ul>

  <script>
    const input = document.getElementById("routineInput");
    const button = document.getElementById("addButton");
    const list = document.getElementById("routineList");

    let routines = [];

    try {
      const saved = localStorage.getItem("dailyLifeRoutines");
      const parsed = saved ? JSON.parse(saved) : [];

      if (
        Array.isArray(parsed) &&
        parsed.every(r =>
          r &&
          typeof r.task === "string" &&
          typeof r.done === "boolean"
        )
      ) {
        routines = parsed;
      }
    } catch (error) {
      routines = [];
    }

    function saveRoutines() {
      try {
        localStorage.setItem(
          "dailyLifeRoutines",
          JSON.stringify(routines)
        );
      } catch (error) {
        alert("রুটিন সেভ হয়নি। ব্রাউজারের স্টোরেজ পরীক্ষা করো।");
      }
    }

    function renderRoutines() {
      list.replaceChildren();

      routines.forEach(function (routine, index) {
        const item = document.createElement("li");

        const tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = routine.done ? "✓" : "";
        tick.setAttribute("aria-label", "সম্পন্ন");
        item.appendChild(tick);

        const taskText = document.createElement("span");
        taskText.textContent = routine.task + " ";
        item.appendChild(taskText);

        const doneButton = document.createElement("button");
        doneButton.type = "button";
        doneButton.className = "done-button";
        doneButton.textContent = routine.done
          ? "সম্পন্ন হয়েছে!"
          : "✓ সম্পন্ন";
        doneButton.disabled = routine.done;

        doneButton.addEventListener("click", function () {
          routines[index].done = true;
          saveRoutines();
          renderRoutines();
        });

        item.appendChild(doneButton);
        list.appendChild(item);
      });
    }

    function addRoutine() {
      const task = input.value.trim();

      if (task === "") {
        alert("আগে রুটিনের নাম লেখো!");
        input.focus();
        return;
      }

      routines.push({
        task: task,
        done: false
      });

      saveRoutines();
      renderRoutines();

      input.value = "";
      input.focus();
    }

    button.addEventListener("click", addRoutine);

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        addRoutine();
      }
    });

    renderRoutines();
  </script>
</body>
</html>
