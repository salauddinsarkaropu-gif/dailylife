<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLife</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 30px 15px;
    }
    h1 {
      color: #3347a8;
    }
    p {
      color: #444;
    }
    button {
      background: #3347a8;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>DailyLife</h1>
  <p>আমার দৈনন্দিন রুটিন</p>
  <input id="routineInput" placeholder="রুটিন লিখো...">
<button onclick="addRoutine()">রুটিন যোগ করো</button>
<ul id="routineList"></ul>
  <script>
function addRoutine() {
  const input = document.getElementById("routineInput");
  const task = input.value.trim();

  if (task === "") {
    alert("আগে রুটিনের নাম লেখো!");
    return;
  }

  const item = document.createElement("li");
  item.textContent = task;

  document.getElementById("routineList").appendChild(item);
  input.value = "";
}
</script>
</body>
</html>
