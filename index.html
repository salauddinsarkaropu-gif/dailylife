
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLife</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      color: #3347a8;
    }

    p {
      color: #444;
    }

    input {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-width: 60%;
    }

    button {
      background: #3347a8;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 10px auto;
      padding: 12px;
      border-radius: 8px;
      max-width: 400px;
      overflow-wrap: anywhere;
    }

    .completed {
      text-decoration: line-through;
      color: green;
    }

    .done-button {
      background: #218838;
    }
  </style>
</head>

<body>
  <h1>DailyLife</h1>
  <p>আমার দৈনন্দিন রুটিন</p>

  <input
    id="routineInput"
    type="text"
    placeholder="রুটিন লিখো..."
  >

  <button id="addButton" type="button">
    রুটিন যোগ করো
  </button>

  <ul id="routineList"></ul>

  <script>
    const input = document.getElementById("routineInput");
    const button = document.getElementById("addButton");
    const list = document.getElementById("routineList");

    function addRoutine() {
      const task = input.value.trim();

      if (task === "") {
        alert("আগে রুটিনের নাম লেখো!");
        input.focus();
        return;
      }

      const item = document.createElement("li");
      const taskText = document.createElement("span");

      taskText.textContent = task + " ";
      item.appendChild(taskText);

      const doneButton = document.createElement("button");
      doneButton.textContent = "✓ সম্পন্ন";
      doneButton.type = "button";
      doneButton.className = "done-button";

      doneButton.addEventListener("click", function () {
        taskText.classList.add("completed");
        doneButton.textContent = "সম্পন্ন হয়েছে!";
        doneButton.disabled = true;
      });

      item.appendChild(doneButton);
      list.appendChild(item);

      input.value = "";
      input.focus();
    }

    button.addEventListener("click", addRoutine);

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        addRoutine();
      }
    });
  </script>
</body>
</html>
