
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLife</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      text-align: center;
      padding: 25px 12px;
      color: #333;
    }

    h1, h2 { color: #3347a8; }

    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin: 5px;
      max-width: 90%;
    }

    button {
      background: #3347a8;
      color: white;
      padding: 11px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li, .study-box, .summary-card {
      background: white;
      margin: 10px auto;
      padding: 14px;
      border-radius: 10px;
      max-width: 420px;
      overflow-wrap: anywhere;
    }

    .done-button, #startButton { background: #218838; }
    .delete-button, #stopButton { background: #dc3545; }

    button:disabled {
      background: #888;
      cursor: default;
    }

    .tick {
      color: #218838;
      font-weight: bold;
      font-size: 20px;
    }

    #timer {
      font-size: 34px;
      font-weight: bold;
      color: #3347a8;
      margin: 15px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 440px;
      margin: auto;
    }

    .summary-card {
      margin: 0;
      padding: 15px 8px;
    }

    .summary-number {
      font-size: 22px;
      font-weight: bold;
      color: #3347a8;
    }

    .subject-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      border-bottom: 1px solid #eee;
      padding: 10px 2px;
    }
  </style>
</head>

<body>
  <h1>DailyLife</h1>
  <p>আমার দৈনন্দিন রুটিন</p>

  <h2>📋 আমার রুটিন</h2>
  <input id="routineInput" type="text" placeholder="রুটিন লিখো...">
  <button id="addButton" type="button">রুটিন যোগ করো</button>
  <ul id="routineList"></ul>

  <hr>

  <h2>📚 পড়াশোনার টাইমার</h2>
  <div class="study-box">
    <p>কোন বিষয় পড়বে?</p>

    <select id="subject">
      <option value="ইতিহাস">ইতিহাস</option>
      <option value="পৌরনীতি">পৌরনীতি</option>
      <option value="অর্থনীতি">অর্থনীতি</option>
      <option value="যুক্তিবিদ্যা">যুক্তিবিদ্যা</option>
      <option value="আইসিটি">আইসিটি</option>
    </select>

    <div id="timer">00:00:00</div>
    <button id="startButton" type="button">▶ Start</button>
    <button id="stopButton" type="button" disabled>■ Stop</button>
    <p id="studyStatus">পড়াশোনা শুরু করতে Start চাপো।</p>

    <h3>পড়ার হিসাব</h3>
    <ul id="studyList"></ul>
  </div>

  <hr>

  <h2>📊 Study Summary</h2>
  <p>আজকের পড়াশোনার সারাংশ</p>

  <div class="summary-grid">
    <div class="summary-card">
      <p>আজ মোট পড়া</p>
      <div id="totalTime" class="summary-number">০ মিনিট</div>
    </div>

    <div class="summary-card">
      <p>আজকের বিষয়</p>
      <div id="subjectCount" class="summary-number">০টি</div>
    </div>
  </div>

  <div class="study-box">
    <h3>কোন বিষয়ে কতক্ষণ পড়েছ?</h3>
    <div id="subjectSummary"></div>
  </div>

  <script>
    const input = document.getElementById("routineInput");
    const list = document.getElementById("routineList");
    const subject = document.getElementById("subject");
    const timer = document.getElementById("timer");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const studyStatus = document.getElementById("studyStatus");
    const studyList = document.getElementById("studyList");

    function load(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
      } catch (e) {
        return fallback;
      }
    }

    let routines = load("dailyLifeRoutines", []);
    if (!Array.isArray(routines)) routines = [];

    let sessions = load("dailyLifeStudySessions", []);
    if (!Array.isArray(sessions)) sessions = [];

    let activeSession = load("dailyLifeActiveStudy", null);

    if (
      !activeSession ||
      typeof activeSession.subject !== "string" ||
      !Number.isFinite(activeSession.start)
    ) {
      activeSession = null;
    }

    function save(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        alert("ডেটা সেভ হয়নি। আবার চেষ্টা করো।");
        return false;
      }
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      return [h, m, s]
        .map(n => String(n).padStart(2, "0"))
        .join(":");
    }

    function formatBanglaTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;

      if (h > 0) return h + " ঘণ্টা " + m + " মিনিট";
      if (m > 0) return m + " মিনিট";
      return s + " সেকেন্ড";
    }

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    function renderRoutines() {
      list.replaceChildren();

      routines.forEach(function (r, i) {
        const li = document.createElement("li");

        const tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = r.done ? "✓ " : "";
        li.appendChild(tick);
        li.appendChild(document.createTextNode(r.task + " "));

        const done = document.createElement("button");
        done.className = "done-button";
        done.textContent = r.done ? "সম্পন্ন হয়েছে!" : "✓ সম্পন্ন";
        done.disabled = r.done;

        done.onclick = function () {
          routines[i].done = true;
          if (save("dailyLifeRoutines", routines)) renderRoutines();
        };
        li.appendChild(done);

        const del = document.createElement("button");
        del.className = "delete-button";
        del.textContent = "🗑️ মুছো";

        del.onclick = function () {
          if (!confirm("এই রুটিনটি মুছে ফেলতে চাও?")) return;

          const removed = routines.splice(i, 1)[0];

          if (save("dailyLifeRoutines", routines)) {
            renderRoutines();
          } else {
            routines.splice(i, 0, removed);
          }
        };

        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function addRoutine() {
      const task = input.value.trim();

      if (!task) {
        alert("আগে রুটিনের নাম লেখো!");
        return;
      }

      routines.push({ task: task, done: false });

      if (save("dailyLifeRoutines", routines)) {
        input.value = "";
        renderRoutines();
      } else {
        routines.pop();
      }
    }

    document.getElementById("addButton").onclick = addRoutine;

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addRoutine();
    });

    function renderSessions() {
      studyList.replaceChildren();

      if (sessions.length === 0) {
        const li = document.createElement("li");
        li.textContent = "এখনো কোনো পড়ার হিসাব নেই।";
        studyList.appendChild(li);
        return;
      }

      sessions.slice().reverse().forEach(function (s) {
        const li = document.createElement("li");
        li.textContent = s.subject + " — " +
          formatBanglaTime(s.seconds) + " (" + s.date + ")";
        studyList.appendChild(li);
      });
    }

    function renderSummary() {
      const today = todayKey();

      const todaysSessions = sessions.filter(s => s.day === today);

      const totals = {};

      todaysSessions.forEach(function (s) {
        if (!Number.isFinite(s.seconds) || s.seconds < 0) return;

        totals[s.subject] = (totals[s.subject] || 0) + s.seconds;
      });

      let totalSeconds = Object.values(totals).reduce(
        (sum, seconds) => sum + seconds, 0
      );

      // চলমান পড়ার সময়ও আজকের সারাংশে দেখানো হবে।
      if (activeSession) {
        const startDay = new Date(activeSession.start);
        if (todayKeyForDate(startDay) === today) {
          const elapsed = Math.max(
            0, Math.floor((Date.now() - activeSession.start) / 1000)
          );

          totals[activeSession.subject] =
            (totals[activeSession.subject] || 0) + elapsed;

          totalSeconds += elapsed;
        }
      }

      document.getElementById("totalTime").textContent =
        formatBanglaTime(totalSeconds);

      document.getElementById("subjectCount").textContent =
        Object.keys(totals).length + "টি";

      const summary = document.getElementById("subjectSummary");
      summary.replaceChildren();

      const names = Object.keys(totals);

      if (names.length === 0) {
        summary.textContent = "আজ এখনো পড়ার সময় রেকর্ড হয়নি।";
        return;
      }

      names.forEach(function (name) {
        const row = document.createElement("div");
        row.className = "subject-row";

        const nameSpan = document.createElement("span");
        nameSpan.textContent = name;

        const timeSpan = document.createElement("strong");
        timeSpan.textContent = formatBanglaTime(totals[name]);

        row.appendChild(nameSpan);
        row.appendChild(timeSpan);
        summary.appendChild(row);
      });
    }

    function todayKeyForDate(d) {
      return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    function updateTimer() {
      if (!activeSession) {
        timer.textContent = "00:00:00";
      } else {
        const elapsed = Math.floor(
          (Date.now() - activeSession.start) / 1000
        );
        timer.textContent = formatTime(elapsed);
      }

      renderSummary();
    }

    function renderActive() {
      startButton.disabled = !!activeSession;
      stopButton.disabled = !activeSession;
      subject.disabled = !!activeSession;

      studyStatus.textContent = activeSession
        ? activeSession.subject + " পড়া চলছে।"
        : "পড়াশোনা শুরু করতে Start চাপো।";

      updateTimer();
    }

    startButton.onclick = function () {
      if (activeSession) return;

      activeSession = {
        subject: subject.value,
        start: Date.now()
      };

      if (!save("dailyLifeActiveStudy", activeSession)) {
        activeSession = null;
        return;
      }

      renderActive();
    };

    stopButton.onclick = function () {
      if (!activeSession) return;

      const end = Date.now();
      const elapsed = Math.max(
        0, Math.floor((end - activeSession.start) / 1000)
      );

      const session = {
        subject: activeSession.subject,
        seconds: elapsed,
        date: new Date(activeSession.start).toLocaleDateString("bn-BD"),
        day: todayKeyForDate(new Date(activeSession.start))
      };

      sessions.push(session);

      if (!save("dailyLifeStudySessions", sessions)) {
        sessions.pop();
        return;
      }

      try {
        localStorage.removeItem("dailyLifeActiveStudy");
      } catch (e) {
        alert("চলমান সেশন পরিষ্কার করতে সমস্যা হয়েছে।");
      }

      activeSession = null;
      renderActive();
      renderSessions();
      renderSummary();
      studyStatus.textContent = "পড়ার সময় সেভ হয়েছে!";
    };

    renderRoutines();
    renderSessions();
    renderActive();
    renderSummary();

    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
